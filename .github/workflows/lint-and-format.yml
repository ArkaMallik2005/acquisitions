name: Lint and Format

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  lint-and-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        id: lint_check
        continue-on-error: true
        run: npm run lint

      - name: Run Prettier check
        id: format_check
        continue-on-error: true
        run: npm run format:check

      - name: Annotate lint and format failures with fixes
        if: steps.lint_check.outcome == 'failure' || steps.format_check.outcome == 'failure'
        run: |
          if [ "${{ steps.lint_check.outcome }}" = "failure" ]; then
            echo "::error title=ESLint issues detected::Linting failed. Run 'npm run lint:fix' locally to auto-fix lint violations."
          fi

          if [ "${{ steps.format_check.outcome }}" = "failure" ]; then
            echo "::error title=Prettier formatting issues detected::Formatting check failed. Run 'npm run format' locally to apply formatting."
          fi

      - name: Fail workflow on lint/format issues
        if: steps.lint_check.outcome == 'failure' || steps.format_check.outcome == 'failure'
        run: exit 1
